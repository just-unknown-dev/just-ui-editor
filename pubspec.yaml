name: just_ui_editor
description: "In-game interface for just_game_engine — screens saved as .ui.json assets and drawn as real Flutter widgets, world-space text and buttons, themes, bindings and actions — and the editor that builds them."
version: 0.1.0
homepage: https://github.com/just-unknown-dev/just-sprite-editor
repository: https://github.com/just-unknown-dev/just-sprite-editor
issue_tracker: https://github.com/just-unknown-dev/just-sprite-editor/issues

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  just_game_engine: ^2.0.0
  just_inputs: ^0.1.0
  just_signals: ^1.0.2

  # Design-time only. `lib/just_ui_editor.dart` — what a game imports —
  # never reaches it; only `lib/editor.dart` does, and a game never imports
  # that.
  just_game_engine_editor: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
